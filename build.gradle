plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
}

loom {
	mods {
		"modern_player_ladder" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testImplementation "org.mockito:mockito-core:5.14.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	jvmArgs("-Dnet.bytebuddy.experimental=true", "-XX:+EnableDynamicAgentLoading")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = System.getenv("MODRINTH_PROJECT_ID")

	versionNumber = project.version.toString()
	versionName = "Modern Player Ladder ${project.version}"
	versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: "release"

	// Minecraft 26.2 uses the unobfuscated Loom plugin; the normal jar is the distributable artifact.
	uploadFile = tasks.jar

	gameVersions = [
		project.minecraft_version.toString()
	]

	loaders = [
		"fabric"
	]

	changelog = System.getenv("MODRINTH_CHANGELOG")
		?: "See GitHub release notes."

	dependencies {
		required.project "fabric-api"
	}

	// Set MODRINTH_DEBUG=true to inspect the payload without publishing a version.
	debugMode = Boolean.parseBoolean(
		System.getenv("MODRINTH_DEBUG") ?: "false"
	)
}

// Publishing must not bypass the normal build/tests.
tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
